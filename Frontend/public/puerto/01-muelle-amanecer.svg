<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Grúas pórtico y buque portacontenedores en el muelle al amanecer">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1b3a"/>
      <stop offset="38%" stop-color="#1d3f77"/>
      <stop offset="68%" stop-color="#53739f"/>
      <stop offset="86%" stop-color="#c07f45"/>
      <stop offset="100%" stop-color="#f2b064"/>
    </linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4a75"/>
      <stop offset="45%" stop-color="#16304f"/>
      <stop offset="100%" stop-color="#0a1b30"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd7a0" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#f0a95e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f0a95e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="viñeta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050c1a" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#050c1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050c1a" stop-opacity="0.72"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1500" fill="url(#cielo)"/>
  <circle cx="820" cy="1010" r="300" fill="url(#halo)"/>
  <circle cx="820" cy="1015" r="62" fill="#ffd9a6" opacity="0.95"/>

  <!-- Nubes largas de amanecer -->
  <g fill="#0d2246" opacity="0.38">
    <rect x="0" y="720" width="520" height="16" rx="8"/>
    <rect x="240" y="790" width="700" height="14" rx="7"/>
    <rect x="620" y="680" width="580" height="12" rx="6"/>
    <rect x="80" y="870" width="420" height="11" rx="5"/>
  </g>

  <!-- Sierra lejana -->
  <path d="M0 1010 L150 925 L280 985 L420 900 L560 980 L700 930 L860 995 L1010 940 L1200 1005 L1200 1060 L0 1060 Z" fill="#12294b" opacity="0.9"/>

  <!-- Buque portacontenedores -->
  <g>
    <rect x="150" y="990" width="720" height="78" rx="6" fill="#0e2340"/>
    <path d="M870 990 L960 1030 L870 1068 Z" fill="#0e2340"/>
    <rect x="150" y="1052" width="810" height="18" fill="#08182d"/>
    <!-- Superestructura -->
    <rect x="185" y="920" width="96" height="72" rx="4" fill="#15304f"/>
    <g fill="#f4c97a" opacity="0.8">
      <rect x="196" y="934" width="14" height="10"/><rect x="218" y="934" width="14" height="10"/>
      <rect x="240" y="934" width="14" height="10"/><rect x="196" y="956" width="14" height="10"/>
      <rect x="218" y="956" width="14" height="10"/><rect x="240" y="956" width="14" height="10"/>
    </g>
    <!-- Contenedores en cubierta -->
    <g>
      <rect x="310" y="936" width="78" height="26" fill="#c0492f"/><rect x="310" y="962" width="78" height="26" fill="#2f6ea8"/>
      <rect x="396" y="924" width="78" height="26" fill="#2f8f6b"/><rect x="396" y="950" width="78" height="26" fill="#c9852c"/>
      <rect x="396" y="976" width="78" height="12" fill="#b04331"/>
      <rect x="482" y="936" width="78" height="26" fill="#3a76ad"/><rect x="482" y="962" width="78" height="26" fill="#a83f2c"/>
      <rect x="568" y="918" width="78" height="26" fill="#cf8f33"/><rect x="568" y="944" width="78" height="26" fill="#2f6ea8"/>
      <rect x="568" y="970" width="78" height="18" fill="#2f8f6b"/>
      <rect x="654" y="940" width="78" height="24" fill="#b64a33"/><rect x="654" y="964" width="78" height="24" fill="#35719f"/>
      <rect x="740" y="948" width="78" height="20" fill="#2f8f6b"/><rect x="740" y="968" width="78" height="20" fill="#c9852c"/>
    </g>
  </g>

  <!-- Grúas pórtico -->
  <g fill="#0a1c33">
    <g>
      <rect x="120" y="470" width="20" height="560"/><rect x="300" y="470" width="20" height="560"/>
      <rect x="96" y="452" width="330" height="26" rx="4"/>
      <rect x="96" y="452" width="520" height="14" rx="6"/>
      <rect x="180" y="330" width="16" height="130"/>
      <path d="M188 330 L420 452 L188 452 Z" opacity="0.85"/>
      <rect x="360" y="466" width="14" height="150"/>
      <rect x="330" y="610" width="76" height="46" rx="5"/>
    </g>
    <g opacity="0.92">
      <rect x="640" y="530" width="18" height="500"/><rect x="800" y="530" width="18" height="500"/>
      <rect x="618" y="514" width="300" height="24" rx="4"/>
      <rect x="618" y="514" width="470" height="12" rx="6"/>
      <rect x="690" y="400" width="14" height="118"/>
      <path d="M697 400 L900 514 L697 514 Z" opacity="0.85"/>
      <rect x="860" y="526" width="12" height="130"/>
      <rect x="834" y="650" width="66" height="40" rx="5"/>
    </g>
  </g>

  <!-- Luces de las grúas -->
  <g fill="#ffd9a6">
    <circle cx="188" cy="326" r="7" opacity="0.9"/>
    <circle cx="697" cy="396" r="6" opacity="0.85"/>
    <circle cx="368" cy="633" r="5" opacity="0.7"/>
  </g>

  <!-- Muelle y agua -->
  <rect x="0" y="1060" width="1200" height="40" fill="#0c1f3a"/>
  <rect x="0" y="1100" width="1200" height="400" fill="url(#agua)"/>
  <g fill="#ffcf96" opacity="0.5">
    <rect x="770" y="1130" width="100" height="6" rx="3"/>
    <rect x="790" y="1160" width="64" height="5" rx="2.5"/>
    <rect x="760" y="1194" width="122" height="6" rx="3"/>
    <rect x="800" y="1232" width="48" height="5" rx="2.5"/>
    <rect x="752" y="1274" width="140" height="6" rx="3"/>
  </g>
  <g fill="#8fb4dd" opacity="0.18">
    <rect x="80" y="1150" width="220" height="5" rx="2.5"/>
    <rect x="160" y="1210" width="300" height="5" rx="2.5"/>
    <rect x="60" y="1290" width="260" height="5" rx="2.5"/>
    <rect x="300" y="1360" width="420" height="5" rx="2.5"/>
  </g>

  <rect width="1200" height="1500" fill="url(#viñeta)"/>
</svg>

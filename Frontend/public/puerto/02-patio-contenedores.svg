<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Patio de contenedores apilados bajo el cielo despejado del mediodía">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123a6b"/>
      <stop offset="45%" stop-color="#2f6aa8"/>
      <stop offset="78%" stop-color="#7fabd4"/>
      <stop offset="100%" stop-color="#c3d8ea"/>
    </linearGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c6572"/>
      <stop offset="100%" stop-color="#2a3038"/>
    </linearGradient>
    <linearGradient id="viñeta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050c1a" stop-opacity="0.5"/>
      <stop offset="42%" stop-color="#050c1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050c1a" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1500" fill="url(#cielo)"/>

  <!-- Nubes -->
  <g fill="#ffffff" opacity="0.5">
    <ellipse cx="260" cy="330" rx="180" ry="46"/>
    <ellipse cx="360" cy="310" rx="120" ry="38"/>
    <ellipse cx="930" cy="470" rx="200" ry="40"/>
    <ellipse cx="820" cy="452" rx="110" ry="30"/>
  </g>

  <!-- Grúa de patio al fondo -->
  <g fill="#1a2e4a" opacity="0.55">
    <rect x="820" y="560" width="14" height="420"/>
    <rect x="1110" y="560" width="14" height="420"/>
    <rect x="800" y="540" width="344" height="24" rx="4"/>
    <rect x="940" y="564" width="80" height="44" rx="4"/>
  </g>

  <!-- Bloque trasero de contenedores (atenuado por la distancia) -->
  <g opacity="0.55">
    <g>
      <rect x="60" y="800" width="150" height="44" fill="#2f6ea8"/><rect x="60" y="844" width="150" height="44" fill="#b04331"/>
      <rect x="60" y="888" width="150" height="44" fill="#c9852c"/>
      <rect x="220" y="844" width="150" height="44" fill="#2f8f6b"/><rect x="220" y="888" width="150" height="44" fill="#35719f"/>
      <rect x="380" y="800" width="150" height="44" fill="#b04331"/><rect x="380" y="844" width="150" height="44" fill="#c9852c"/>
      <rect x="380" y="888" width="150" height="44" fill="#2f6ea8"/>
      <rect x="540" y="844" width="150" height="44" fill="#35719f"/><rect x="540" y="888" width="150" height="44" fill="#2f8f6b"/>
      <rect x="700" y="888" width="150" height="44" fill="#c9852c"/>
    </g>
  </g>

  <!-- Bloque delantero: contenedores con puertas y corrugado -->
  <g>
    <!-- fila superior -->
    <g>
      <rect x="120" y="960" width="230" height="86" rx="3" fill="#c4502f"/>
      <g stroke="#9c3d23" stroke-width="3" opacity="0.8">
        <line x1="150" y1="964" x2="150" y2="1042"/><line x1="180" y1="964" x2="180" y2="1042"/>
        <line x1="210" y1="964" x2="210" y2="1042"/><line x1="240" y1="964" x2="240" y2="1042"/>
        <line x1="270" y1="964" x2="270" y2="1042"/><line x1="300" y1="964" x2="300" y2="1042"/>
      </g>
      <rect x="120" y="960" width="230" height="10" fill="#d9663f" opacity="0.6"/>

      <rect x="362" y="960" width="230" height="86" rx="3" fill="#2f6ea8"/>
      <g stroke="#23557f" stroke-width="3" opacity="0.8">
        <line x1="392" y1="964" x2="392" y2="1042"/><line x1="422" y1="964" x2="422" y2="1042"/>
        <line x1="452" y1="964" x2="452" y2="1042"/><line x1="482" y1="964" x2="482" y2="1042"/>
        <line x1="512" y1="964" x2="512" y2="1042"/><line x1="542" y1="964" x2="542" y2="1042"/>
      </g>
      <rect x="362" y="960" width="230" height="10" fill="#4184be" opacity="0.6"/>

      <rect x="604" y="960" width="230" height="86" rx="3" fill="#2f8f6b"/>
      <g stroke="#236e52" stroke-width="3" opacity="0.8">
        <line x1="634" y1="964" x2="634" y2="1042"/><line x1="664" y1="964" x2="664" y2="1042"/>
        <line x1="694" y1="964" x2="694" y2="1042"/><line x1="724" y1="964" x2="724" y2="1042"/>
        <line x1="754" y1="964" x2="754" y2="1042"/><line x1="784" y1="964" x2="784" y2="1042"/>
      </g>
      <rect x="604" y="960" width="230" height="10" fill="#44a882" opacity="0.6"/>

      <rect x="846" y="960" width="230" height="86" rx="3" fill="#cf8f33"/>
      <g stroke="#a56e22" stroke-width="3" opacity="0.8">
        <line x1="876" y1="964" x2="876" y2="1042"/><line x1="906" y1="964" x2="906" y2="1042"/>
        <line x1="936" y1="964" x2="936" y2="1042"/><line x1="966" y1="964" x2="966" y2="1042"/>
        <line x1="996" y1="964" x2="996" y2="1042"/><line x1="1026" y1="964" x2="1026" y2="1042"/>
      </g>
      <rect x="846" y="960" width="230" height="10" fill="#e0a54c" opacity="0.6"/>
    </g>

    <!-- fila inferior con puertas -->
    <g>
      <rect x="120" y="1050" width="230" height="86" rx="3" fill="#35719f"/>
      <rect x="128" y="1058" width="104" height="70" rx="2" fill="#2c5f87"/>
      <rect x="238" y="1058" width="104" height="70" rx="2" fill="#2c5f87"/>
      <g fill="#8fb4dd" opacity="0.7"><rect x="228" y="1074" width="6" height="38" rx="3"/><rect x="236" y="1074" width="6" height="38" rx="3"/></g>

      <rect x="362" y="1050" width="230" height="86" rx="3" fill="#b04331"/>
      <rect x="370" y="1058" width="104" height="70" rx="2" fill="#94382a"/>
      <rect x="480" y="1058" width="104" height="70" rx="2" fill="#94382a"/>
      <g fill="#e2a08f" opacity="0.7"><rect x="470" y="1074" width="6" height="38" rx="3"/><rect x="478" y="1074" width="6" height="38" rx="3"/></g>

      <rect x="604" y="1050" width="230" height="86" rx="3" fill="#cf8f33"/>
      <rect x="612" y="1058" width="104" height="70" rx="2" fill="#ae7727"/>
      <rect x="722" y="1058" width="104" height="70" rx="2" fill="#ae7727"/>
      <g fill="#f3d193" opacity="0.7"><rect x="712" y="1074" width="6" height="38" rx="3"/><rect x="720" y="1074" width="6" height="38" rx="3"/></g>

      <rect x="846" y="1050" width="230" height="86" rx="3" fill="#2f8f6b"/>
      <rect x="854" y="1058" width="104" height="70" rx="2" fill="#267557"/>
      <rect x="964" y="1058" width="104" height="70" rx="2" fill="#267557"/>
      <g fill="#9ed9c1" opacity="0.7"><rect x="954" y="1074" width="6" height="38" rx="3"/><rect x="962" y="1074" width="6" height="38" rx="3"/></g>
    </g>
  </g>

  <!-- Suelo del patio con marcas -->
  <rect x="0" y="1136" width="1200" height="364" fill="url(#suelo)"/>
  <g stroke="#f0c24a" stroke-width="6" opacity="0.35" stroke-linecap="round">
    <line x1="60" y1="1210" x2="330" y2="1210"/>
    <line x1="400" y1="1210" x2="670" y2="1210"/>
    <line x1="740" y1="1210" x2="1010" y2="1210"/>
    <line x1="20" y1="1330" x2="380" y2="1330"/>
    <line x1="460" y1="1330" x2="820" y2="1330"/>
    <line x1="900" y1="1330" x2="1180" y2="1330"/>
  </g>
  <rect x="0" y="1136" width="1200" height="16" fill="#0f1620" opacity="0.5"/>

  <rect width="1200" height="1500" fill="url(#viñeta)"/>
</svg>
